name: Update Profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats & Top Languages
        uses: anuraghazra/github-readme-stats@master
        with:
          username: SomebodyXPS
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight
          hide_border: true
          bg_color: "0D1117"
          title_color: "38BDF8"
          icon_color: "38BDF8"
          show_icons: true
          stats_path: profile-stats.svg
          langs_path: top-langs.svg
          langs_layout: compact

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          username: SomebodyXPS
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight
          hide_border: true
          background: "0D1117"
          ring: "38BDF8"
          fire: "38BDF8"
          currStreakLabel: "38BDF8"
          output-path: streak-stats.svg

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SomebodyXPS
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update profile SVGs"
          git push
